<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Giclee</title>
    <style>
      html, body { margin: 0; height: 100%; background: #15171a; color: #e6e8eb;
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
      body { display: grid; place-items: center; text-align: center; padding: 24px; box-sizing: border-box; }
      code { color: #f2b04b; }
    </style>
  </head>
  <body>
    <div>
      <h1 style="font-size: 18px">Giclee UI not built</h1>
      <p>This build was configured with <code>GICLEE_BUILD_UI=OFF</code>.<br />
        Reconfigure with Node.js installed and <code>-DGICLEE_BUILD_UI=ON</code>,<br />
        or run the Vite dev server and set <code>GICLEE_UI_DEV_URL</code> (Debug builds).</p>
    </div>
  </body>
</html>
